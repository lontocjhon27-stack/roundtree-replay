name: Daily bad-number check (SMS DND for dead numbers)

on:
  schedule:
    - cron: '0 15 * * *'   # every day 15:00 UTC = 7 AM PT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (count only, change nothing)'
        type: boolean
        default: true
      lookback_days:
        description: 'Check contacts added in the last N days'
        required: false
        default: '45'

concurrency:
  group: bad-numbers
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check and mark bad numbers
        env:
          GHL_TOKEN: ${{ secrets.GHL_BADNUM_TOKEN }}
          GHL_LOCATION_ID: ${{ vars.GHL_LOCATION_ID || 'pcY7ioQLTs15S0hJiOdG' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '45' }}
        run: python scripts/bad_numbers.py
